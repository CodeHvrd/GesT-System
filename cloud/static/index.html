<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1f1a">
<title>GesT · Resumen de gestión</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6b53'/%3E%3Ctext x='32' y='43' font-family='system-ui,sans-serif' font-size='30' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/cloud.css">
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="brand">
      <div class="mark">G</div>
      <div>
        <h1 id="brand-name">GesT</h1>
        <p>Resumen de gestión</p>
      </div>
    </div>
    <div class="period">
      <div class="presets">
        <button type="button" class="chip" data-preset="week">Semana actual</button>
        <button type="button" class="chip active" data-preset="month">Mes actual</button>
        <button type="button" class="chip" data-preset="prev-month">Mes pasado</button>
      </div>
      <div class="dates">
        <label>Desde <input type="date" id="from"></label>
        <label>Hasta <input type="date" id="to"></label>
        <button type="button" id="apply" class="btn">Ver</button>
      </div>
    </div>
  </header>

  <main id="main">
    <div id="loading" class="loading"><span class="spinner"></span> Cargando datos…</div>
    <div id="content" hidden>
      <section id="kpis" class="kpis"></section>
      <p id="compare" class="compare"></p>

      <section class="card">
        <div class="card-head">
          <h2>Ventas por día</h2>
          <span id="chart-note" class="muted"></span>
        </div>
        <div class="chart-wrap">
          <svg id="chart" viewBox="0 0 820 230" preserveAspectRatio="none" role="img" aria-label="Ventas por día"></svg>
        </div>
        <div class="legend">
          <span><i class="dot menu"></i> Menú</span>
          <span><i class="dot delivery"></i> Delivery</span>
        </div>
      </section>

      <div class="cols">
        <section class="card">
          <div class="card-head">
            <h2>Categorías</h2>
            <span id="cats-note" class="muted"></span>
          </div>
          <div class="table-wrap">
            <table id="cats">
              <thead>
                <tr><th>Categoría</th><th class="r">Ventas</th><th class="r">CMV</th><th class="r">Part.</th><th class="r">vs ant.</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>Gastos</h2>
            <span id="exp-note" class="muted"></span>
          </div>
          <div id="expenses"></div>
        </section>
      </div>

      <section class="review">
        <div class="card-head">
          <h2>Revisión</h2>
          <span class="muted">lo que conviene mirar</span>
        </div>
        <div class="levels">
          <div class="level critico">
            <h3>Crítico <b id="n-critico">0</b></h3>
            <div id="rev-critico"></div>
          </div>
          <div class="level atencion">
            <h3>Atención <b id="n-atencion">0</b></h3>
            <div id="rev-atencion"></div>
          </div>
          <div class="level info">
            <h3>Info <b id="n-info">0</b></h3>
            <div id="rev-info"></div>
          </div>
        </div>
      </section>

      <footer id="foot" class="foot"></footer>
    </div>
  </main>
</div>
<script src="/cloud.js"></script>
</body>
</html>
