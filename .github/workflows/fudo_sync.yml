name: Fudo & Planilla Contable Scheduled Sync (02:00 & 16:00 ARG)

on:
  schedule:
    # 02:00 hs ARG = 05:00 UTC
    # 16:00 hs ARG = 19:00 UTC
    - cron: "0 5,19 * * *"
  workflow_dispatch:

jobs:
  sync-fudo-and-contable:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scheduled Sync Endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SYNC_CRON_TOKEN: ${{ secrets.SYNC_CRON_TOKEN }}
        run: |
          if [ -n "$APP_BASE_URL" ]; then
            curl -fsSL -X POST "${APP_BASE_URL%/}/api/sync" \
              -H "Content-Type: application/json" \
              -H "x-cron-token: ${SYNC_CRON_TOKEN}" \
              -d '{"source":"scheduled_cron","days_back":30}'
          else
            echo "APP_BASE_URL not configured in repository secrets; skipping remote trigger."
          fi

