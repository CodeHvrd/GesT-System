name: sync-fudo

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci --include=dev
      - name: Sincronizar Fudo + Contable → Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL || vars.DATABASE_URL_DIRECT || vars.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL || vars.DATABASE_URL_DIRECT || vars.DATABASE_URL }}
          FUDO_API_KEY: ${{ secrets.FUDO_API_KEY || vars.FUDO_API_KEY }}
          FUDO_API_SECRET: ${{ secrets.FUDO_API_SECRET || vars.FUDO_API_SECRET }}
        run: npx tsx -e "import { runFullFudoAndContableSync } from './src/lib/scheduler'; runFullFudoAndContableSync({ daysBack: 10 }).then(r => console.log('Resultado sync:', r)).catch(e => { console.error(e); process.exit(1); });"
